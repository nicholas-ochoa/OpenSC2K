name: CI and nightly

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Replace the nightly release with this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    # GitHub gives fork pull requests no secrets, so they only build packages.
    if: >-
      github.repository == 'nicholas-ochoa/OpenSC2K' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Package
    uses: ./.github/workflows/package.yml

  nightly:
    name: Replace the nightly release
    needs: [test, build]
    if: >-
      github.repository == 'nicholas-ochoa/OpenSC2K' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-packages
          path: local/packages
      - name: Publish and replace the nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_nightly.py --packages local/packages
