name: Package

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default is the commit that started the caller)
        type: string
        default: ''
      version:
        description: Package label (default is nightly- and the short commit hash)
        type: string
        default: ''
      retention-days:
        description: Days to keep the desktop-packages artifact
        type: number
        default: 1

permissions:
  contents: read

jobs:
  native:
    name: Build native libraries (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            native/simulation
            native/rendering
            native/formats
            native/audio
      # rust-toolchain.toml selects the Rust version. rustup is on each runner image.
      # The audio library folder also receives FluidSynth, which needs CMake
      - name: Build the package libraries
        run: python tools/build_native.py --package
      - name: Save the libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.platform }}
          path: |
            game/bin/opensc2k_simulation/${{ matrix.platform }}/*
            game/bin/opensc2k_rendering/${{ matrix.platform }}/*
            game/bin/opensc2k_formats/${{ matrix.platform }}/*
            game/bin/opensc2k_audio/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build desktop packages
    needs: native
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Godot and export templates
        run: bash tools/setup_godot_ci.sh
      - name: Collect native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: local/native
          merge-multiple: true
      - name: Build desktop packages
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          label="${PACKAGE_VERSION:-nightly-$(git rev-parse --short=8 HEAD)}"
          python tools/build_desktop_release.py --output local/packages --label "$label" --native local/native
      - name: Save packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-packages
          path: local/packages/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
