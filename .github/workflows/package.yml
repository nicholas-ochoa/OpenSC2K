name: Package

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default is the commit that started the caller)
        type: string
        default: ''
      version:
        description: Package label (default is nightly- and the short commit hash)
        type: string
        default: ''
      retention-days:
        description: Days to keep the desktop-packages artifact
        type: number
        default: 1
      signing:
        description: >-
          macOS Developer ID signing and notarization: none, optional (sign when the
          repository secrets are set), or required
        type: string
        default: none

permissions:
  contents: read

jobs:
  native:
    name: Build native libraries (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
            # tools/build_native.py selects the target from the Python architecture
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    # macOS builds every crate twice for the universal library. A cold Rust cache needs about 35 minutes
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-architecture }}
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
      # cpal in the native game links ALSA on Linux
      - name: Install the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      # rust-toolchain.toml selects the Rust version. rustup is on each runner image.
      # The audio library folder also receives FluidSynth, which needs CMake
      - name: Build the package libraries
        run: python tools/build_native.py --package
      - name: Save the libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.platform }}
          path: |
            game/bin/opensc2k_simulation/${{ matrix.platform }}/*
            game/bin/opensc2k_rendering/${{ matrix.platform }}/*
            game/bin/opensc2k_formats/${{ matrix.platform }}/*
            game/bin/opensc2k_audio/${{ matrix.platform }}/*
            game/bin/opensc2k_scripting/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build desktop packages
    needs: native
    runs-on: macos-15
    # notarization usually takes a few minutes, but Apple can queue a submission longer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Godot and export templates
        run: bash tools/setup_godot_ci.sh
      - name: Collect native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: local/native
          merge-multiple: true
      - name: Prepare macOS signing
        if: inputs.signing != 'none'
        env:
          SIGNING: ${{ inputs.signing }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tools/setup_macos_signing_ci.sh
      - name: Build desktop packages
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SIGNING: ${{ inputs.signing }}
        run: |
          label="${PACKAGE_VERSION:-nightly-$(git rev-parse --short=8 HEAD)}"
          require=''
          if [ "$SIGNING" = required ]; then
            require=--require-notarization
          fi
          python tools/build_desktop_release.py --output local/packages --label "$label" --native local/native $require
      - name: Remove the signing keychain
        if: always() && inputs.signing != 'none'
        run: bash tools/cleanup_macos_signing_ci.sh
      - name: Save packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-packages
          path: local/packages/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
