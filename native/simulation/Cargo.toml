[package]
name = "opensc2k_simulation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Native SimCity 2000 simulation for OpenSC2K"

[lib]
crate-type = ["cdylib"]

[dependencies]
sc2k_sim = { path = "../core/sim" }
sc2k_game = { path = "../core/game" }
sc2k_formats = { path = "../core/formats" }
sc2k_assets = { path = "../core/assets" }
sc2k_platform = { path = "../core/platform" }
godot = { version = "0.5.5", features = ["api-4-7", "experimental-threads"] }
