[package]
name = "opensc2k_rendering"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Native city region preparation for OpenSC2K"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7", "experimental-threads"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false

[profile.dev]
opt-level = 1
